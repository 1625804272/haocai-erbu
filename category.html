<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>机型列表 · 耗材二部官网</title>
<meta name="description" content="耗材二部官网 —— 具体机型参数列表。" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===== Header ===== -->
<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="index.html" class="brand" aria-label="耗材二部官网首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect x="3" y="3" width="26" height="26" rx="6" fill="#E50012"/>
          <path d="M9 22 L16 9 L23 22 Z" fill="#fff"/>
          <circle cx="16" cy="18.5" r="2.4" fill="#E50012"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>耗材二部</strong><span class="brand-en">CONSUMABLES DEPT.2</span>
      </span>
    </a>

    <nav class="top-nav" aria-label="主导航">
      <a href="index.html#tech" data-i18n="nav.tech">产品技术</a>
      <a href="index.html#footer" data-i18n="nav.about">关于我们</a>
      <a href="admin.html" class="nav-admin" data-i18n="nav.admin">管理后台</a>
    </nav>

    <select id="langSelect" class="lang-select" aria-label="语言"></select>

    <button class="menu-toggle" id="menuToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <!-- ===== Breadcrumb ===== -->
  <div class="breadcrumb">
    <div class="container">
      <a href="index.html" data-i18n="crumb.home">首页</a>
      <span class="sep">/</span>
      <span id="crumbCat">产品技术</span>
    </div>
  </div>

  <!-- ===== Category Hero ===== -->
  <section class="cat-hero" id="catHero">
    <div class="container cat-hero-inner">
      <div class="cat-hero-visual">
        <img id="catHeroImg" src="" alt="" loading="lazy" />
      </div>
      <div class="cat-hero-copy">
        <span class="eyebrow" id="catHeroEn">CATEGORY</span>
        <h1 id="catHeroName">品类</h1>
        <p class="cat-hero-tech" id="catHeroTech"></p>
        <ul class="cat-hero-points" id="catHeroPoints"></ul>
        <div class="cat-hero-meta">
          <span class="pill" id="catHeroCount">0 款机型</span>
          <a href="index.html#tech" class="btn btn-ghost btn-sm" data-i18n="cat.back">← 返回全部品类</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Models ===== -->
  <section class="models-section">
    <div class="container">
      <div class="section-head">
        <div>
          <h2 class="section-title" id="modelsTitle" data-i18n="models.title">具体机型</h2>
          <p class="section-sub" data-i18n="models.sub">点击机型查看完整参数，可选中多款进行对比。</p>
        </div>
        <div class="tech-search">
          <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="modelSearch" type="search" data-i18n-ph="search.model.placeholder" placeholder="搜索型号或参数，如 XP600 / I3200 / A3" autocomplete="off" />
        </div>
      </div>

      <div class="product-grid" id="productGrid"></div>

      <div class="empty-state" id="modelEmpty" hidden>
        <div class="empty-ico">🔍</div>
        <p data-i18n="empty.model">没有找到匹配的机型</p>
        <button class="btn btn-ghost" id="modelReset" data-i18n="empty.clear">清除搜索</button>
      </div>
    </div>
  </section>

  <!-- ===== Compare tray ===== -->
  <div class="compare-tray" id="compareTray" hidden>
    <div class="container compare-tray-inner">
      <div class="compare-slots" id="compareSlots"></div>
      <div class="compare-actions">
        <button class="btn btn-ghost btn-sm" id="clearCompare" data-i18n="compare.clear">清空</button>
        <button class="btn btn-primary btn-sm" id="openCompare"><span data-i18n="compare.open">对比选中</span> (<span id="compareCount">0</span>)</button>
      </div>
    </div>
  </div>

</main>

<!-- ===== Footer ===== -->
<footer class="site-footer" id="footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="brand-text"><strong>耗材二部</strong><span class="brand-en">CONSUMABLES DEPT.2</span></span>
      <p data-i18n="footer.desc">热转印设备产品技术中心。数据来源于耗材二部产品资料对比表，参数以实物为准。</p>
    </div>
    <div class="footer-cols">
      <div>
        <h4 data-i18n="footer.col1">产品品类</h4>
        <ul id="footerCats"></ul>
      </div>
      <div>
        <h4 data-i18n="footer.col2">帮助</h4>
        <ul>
          <li><a href="index.html#tech" data-i18n="footer.tech">产品技术</a></li>
          <li><a href="index.html" data-i18n="footer.home">回到首页</a></li>
        </ul>
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    <div class="container">© <span id="year"></span> <span data-i18n="footer.copy">耗材二部 · 热转印设备技术中心</span></div>
  </div>
</footer>

<!-- ===== Detail Modal ===== -->
<div class="modal" id="detailModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card modal-detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <button class="modal-close" data-close aria-label="关闭">&times;</button>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- ===== Compare Modal ===== -->
<div class="modal" id="compareModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card modal-compare" role="dialog" aria-modal="true" aria-labelledby="compareTitle">
    <button class="modal-close" data-close aria-label="关闭">&times;</button>
    <div class="compare-body" id="compareBody"></div>
  </div>
</div>

<script src="data/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
